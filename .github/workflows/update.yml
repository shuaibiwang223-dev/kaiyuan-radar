name: 每小时更新数据

on:
  schedule:
    - cron: '17 * * * *'      # 每小时一次（每 3 小时其中一次是全站扫描，程序自己判断）
  workflow_dispatch:          # 也可以在 Actions 页面手动点“Run workflow”立即更新
    inputs:
      full:
        description: '立即做一次全站扫描'
        type: boolean
        default: false

permissions:
  contents: write   # 把数据存到 Release
  pages: write      # 发布网站
  id-token: write   # 发布网站需要
  actions: write    # 让定时任务保持开启

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      STORE: data-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 取出上次的数据
        run: |
          mkdir -p state
          if gh release view "$STORE" >/dev/null 2>&1; then
            gh release download "$STORE" -p state.json.gz -D state   # 下载失败会直接报错停止，不会用空数据覆盖
            cp state/state.json.gz state-prev.json.gz                  # 留一份上次的数据当备份
          else
            echo "第一次运行，从零开始"
          fi

      - name: 采集 GitHub 数据
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node collector/collect.mjs state ${{ inputs.full && '--full' || '' }}

      - name: 保存数据（存到 Release，仓库不会越来越大）
        run: |
          gh release view "$STORE" >/dev/null 2>&1 || gh release create "$STORE" --title "数据存储（自动生成，请勿删除）" --notes "开源雷达的采集数据，每小时自动更新。删除会丢失全部历史。" --latest=false
          gh release upload "$STORE" state/state.json.gz --clobber
          [ -f state-prev.json.gz ] && gh release upload "$STORE" state-prev.json.gz --clobber || true

      - name: 生成网站
        run: node scripts/build-site.mjs state _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 防止定时任务因长期无人操作被 GitHub 自动停用
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable" || true
