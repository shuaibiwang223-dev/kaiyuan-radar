<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c2410c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23fff'/%3E%3C/svg%3E">
<title>技能雷达</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--sub:#6b6860;--line:#e4e1d8;--accent:#c2410c;--accent-bg:#fff1e8;--chip:#efede6;--good:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#eeebe3;--sub:#a09c91;--line:#33312c;--accent:#fb923c;--accent-bg:#3a2415;--chip:#2a2824;--good:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0;letter-spacing:.5px}
h1 span{color:var(--accent)}
.meta{color:var(--sub);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:4px 11px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip small{color:var(--sub);margin-left:3px}
.chip.on small{color:inherit;opacity:.7}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start}
.rank{color:var(--sub);font-variant-numeric:tabular-nums;font-size:14px;padding-top:2px;text-align:right}
.rank.top{color:var(--accent);font-weight:700}
.name{font-weight:600;color:var(--ink);text-decoration:none;word-break:break-all}
.name:hover{color:var(--accent);text-decoration:underline}
.desc{color:var(--sub);font-size:13.5px;margin:2px 0 6px;word-break:break-word}
.tags{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);align-items:center}
.tag{background:var(--chip);border-radius:5px;padding:1px 7px;color:var(--ink)}
.hot{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nums{text-align:right;white-space:nowrap}
.stars{font-weight:700;font-variant-numeric:tabular-nums}
.speed{font-size:12.5px;color:var(--good);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.fav{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.note{width:100%;margin-top:8px;padding:6px 9px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--ink);font-size:13px}
.cmd{grid-column:2/4;font:12.5px ui-monospace,Consolas,monospace;background:var(--chip);border-radius:6px;padding:6px 9px;user-select:all;word-break:break-all}
@media (min-width:1150px){#list{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:start}#list .row{margin:0}#list .empty{grid-column:1/3}}
.empty{text-align:center;color:var(--sub);padding:50px 10px}
.more{display:block;margin:14px auto;padding:9px 22px}
.tip{font-size:12.5px;color:var(--sub);margin:-4px 0 12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:600px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}.chip{flex:none}.row{grid-template-columns:26px 1fr}.nums{grid-column:2;text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.acts{margin:0}.cmd{grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>技能<span>雷达</span></h1>
  <div class="meta" id="meta">正在加载数据…</div>
  <a class="meta" href="../" style="margin-left:auto">← 开源雷达</a>
</header>

<div class="tabs" id="tabs">
  <button class="tab on" data-t="hot">🔥 爆款榜</button>
  <button class="tab" data-t="all">⭐ 总星榜</button>
  <button class="tab" data-t="new">🆕 新上线</button>
  <button class="tab" data-t="act">🔧 最近更新</button>
  <button class="tab" data-t="fav">❤ 我的收藏 <span id="favn"></span></button>
</div>
<div class="tip" id="tip"></div>

<div class="bar">
  <input type="search" id="q" placeholder="搜索名称或简介，例如：电商、小红书、video、法律、股票">
  <select id="hs" title="爆款榜排序依据">
    <option value="v">按上线以来日均涨星</option>
    <option value="g1">按近 1 天实际涨星</option>
    <option value="g7">按近 7 天实际涨星</option>
  </select>
  <select id="win" title="创建时间">
    <option value="0">创建时间不限</option>
    <option value="30">30 天内新建</option>
    <option value="90">90 天内新建</option>
    <option value="180">半年内新建</option>
  </select>
</div>
<div class="chips" id="chips"></div>

<div id="list"></div>
<button class="btn more" id="more" hidden>显示更多</button>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var DATA=[], CATLIST=[], AT='', tab='hot', cat='全部', shown=60, openCmd=null;
var favs={};            // repo -> note
var HAS1=false, HAS7=false;
var TIPS={
  hot:'默认按「上线以来日均涨星」排序（星标数 ÷ 上线天数）。攒够 1 天、7 天的数据后，可以切换成按实际涨星排序。',
  all:'按总星标数排序，最经得起考验的老牌 Skill。',
  'new':'按上线日期排序，最新出现的 Skill 仓库。',
  act:'按最近一次更新排序，还在持续维护的仓库。',
  fav:'你收藏的 Skill，可以给每个写备注。收藏存在当前这台设备的浏览器里，手机和电脑各存各的。'
};
var $=function(id){return document.getElementById(id)};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function fmt(n){return n>=10000?(n/10000).toFixed(n>=100000?0:1)+'万':String(n)}
function days(d){return Math.floor((Date.now()-new Date(d+'T00:00:00Z').getTime())/864e5)}
function ago(d){var n=days(d);if(n<=0)return'今天';if(n<30)return n+' 天前';if(n<365)return Math.floor(n/30)+' 个月前';return (n/365).toFixed(1)+' 年前'}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove('on')},1600)}

/* ---------- 收藏：存在这台设备的浏览器里 ---------- */
function lsLoad(){try{var t=localStorage.getItem('radar_favs');if(t)favs=JSON.parse(t)||{}}catch(e){}}
function saveFavs(){try{localStorage.setItem('radar_favs',JSON.stringify(favs))}catch(e){}updateFavCount()}
function updateFavCount(){var n=Object.keys(favs).length;$('favn').textContent=n?'('+n+')':''}

/* ---------- view ---------- */
function filtered(){
  var q=$('q').value.trim().toLowerCase(), win=+$('win').value;
  var a=DATA.filter(function(x){
    if(tab==='fav'&&!(x.n in favs))return false;
    if(cat!=='全部'&&x.k!==cat)return false;
    if(win&&days(x.c)>win)return false;
    if(q&&(x.n+' '+x.d+' '+x.k).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var hm=$('hs').value;
  if(tab==='hot'&&hm!=='v')a=a.filter(function(x){return typeof x[hm]==='number'});
  var key={hot:function(x){return x[hm]},all:function(x){return x.s},'new':function(x){return x.c},act:function(x){return x.p},fav:function(x){return x.s}}[tab];
  a.sort(function(x,y){var p=key(x),r=key(y);return p<r?1:p>r?-1:y.s-x.s});
  return a;
}
function renderChips(){
  var q=$('q').value.trim().toLowerCase(), win=+$('win').value, cnt={},total=0;
  DATA.forEach(function(x){
    if(tab==='fav'&&!(x.n in favs))return;
    if(win&&days(x.c)>win)return;
    if(q&&(x.n+' '+x.d+' '+x.k).toLowerCase().indexOf(q)<0)return;
    cnt[x.k]=(cnt[x.k]||0)+1;total++;
  });
  var order=['全部'].concat(CATLIST.length?CATLIST:Object.keys(cnt).sort());
  var box=$('chips');box.textContent='';
  order.forEach(function(k){
    var n=k==='全部'?total:(cnt[k]||0);
    if(k!=='全部'&&!n&&k!==cat)return;
    var b=el('button','chip'+(k===cat?' on':''),k);b.appendChild(el('small',null,String(n)));
    b.onclick=function(){cat=k;shown=60;render()};
    box.appendChild(b);
  });
}
function row(x,i){
  var r=el('div','row');
  r.appendChild(el('div','rank'+(i<3?' top':''),String(i+1)));
  var mid=el('div');
  var a=el('a','name',x.n);a.href='https://github.com/'+x.n;a.target='_blank';a.rel='noopener';
  mid.appendChild(a);
  mid.appendChild(el('div','desc',x.d||'（没有简介）'));
  var tg=el('div','tags');
  tg.appendChild(el('span','tag',x.k));
  if(days(x.c)<=30)tg.appendChild(el('span','tag hot','新'));
  if(x.l)tg.appendChild(el('span',null,x.l));
  tg.appendChild(el('span',null,'上线 '+ago(x.c)));
  tg.appendChild(el('span',null,'更新 '+ago(x.p)));
  mid.appendChild(tg);
  if(x.n in favs){
    var nt=el('input','note');nt.type='text';nt.placeholder='写个备注：打算拿它做什么…';nt.value=favs[x.n]||'';nt.maxLength=200;
    nt.onchange=function(){favs[x.n]=nt.value;saveFavs()};
    mid.appendChild(nt);
  }
  r.appendChild(mid);
  var nums=el('div','nums');
  nums.appendChild(el('div','stars','★ '+fmt(x.s)));
  var hm=$('hs').value,sp='日均 +'+x.v;
  if(tab==='hot'&&hm==='g1'&&typeof x.g1==='number')sp='近1天 '+(x.g1>=0?'+':'')+x.g1;
  if(tab==='hot'&&hm==='g7'&&typeof x.g7==='number')sp='近7天 '+(x.g7>=0?'+':'')+x.g7;
  nums.appendChild(el('div','speed',sp));
  var acts=el('div','acts');
  var fb=el('button','btn'+(x.n in favs?' fav':''),x.n in favs?'已收藏':'收藏');
  fb.onclick=function(){if(x.n in favs)delete favs[x.n];else favs[x.n]='';saveFavs();render()};
  var cb=el('button','btn','安装命令');
  cb.onclick=function(){
    var cmd='npx skills add '+x.n;
    openCmd=openCmd===x.n?null:x.n;render();
    try{navigator.clipboard.writeText(cmd).then(function(){toast('已复制安装命令')},function(){})}catch(e){}
  };
  acts.appendChild(fb);acts.appendChild(cb);nums.appendChild(acts);
  r.appendChild(nums);
  if(openCmd===x.n)r.appendChild(el('div','cmd','npx skills add '+x.n));
  return r;
}
function render(){
  $('tip').textContent=TIPS[tab];
  $('hs').hidden=tab!=='hot';
  renderChips();
  var a=filtered(),box=$('list');box.textContent='';
  if(!DATA.length){box.appendChild(el('div','empty','还没有数据。'));$('more').hidden=true;return}
  if(!a.length){box.appendChild(el('div','empty',tab==='fav'?'还没有收藏。在榜单里点「收藏」就会出现在这里。':'没有符合条件的 Skill，换个关键词或分类试试。'));$('more').hidden=true;return}
  var frag=document.createDocumentFragment();
  a.slice(0,shown).forEach(function(x,i){frag.appendChild(row(x,i))});
  box.appendChild(frag);
  $('more').hidden=a.length<=shown;
  $('more').textContent='显示更多（还有 '+(a.length-shown)+' 个）';
}

/* ---------- events ---------- */
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab');if(!b)return;
  tab=b.dataset.t;shown=60;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('on',t===b)});
  render();
});
var qt;$('q').addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(function(){shown=60;render()},150)});
$('win').addEventListener('change',function(){shown=60;render()});
$('hs').addEventListener('change',function(){shown=60;render()});
$('more').addEventListener('click',function(){shown+=60;render()});

/* ---------- boot ---------- */
lsLoad();updateFavCount();
fetch('data.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  DATA=Array.isArray(j.items)?j.items:[];CATLIST=Array.isArray(j.cats)?j.cats.filter(function(c){return typeof c==='string'}):[];AT=j.at||'';HAS1=!!j.has1;HAS7=!!j.has7;
  $('hs').options[1].disabled=!HAS1;$('hs').options[2].disabled=!HAS7;
  if(!HAS1)$('hs').options[1].textContent='近 1 天实际涨星（数据还在攒）';
  if(!HAS7)$('hs').options[2].textContent='近 7 天实际涨星（数据还在攒）';
  var t=AT?new Date(AT.replace('Z',':00Z')):null;
  $('meta').textContent='共 '+DATA.length+' 个 Skill 仓库 · 数据采集于 '+(t&&!isNaN(t)?t.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未知时间')+' · 来源 GitHub';
  render();
}).catch(function(){
  $('meta').textContent='数据加载失败';
  $('list').appendChild(el('div','empty','榜单数据没有读到，请稍后刷新页面再试。'));
});
})();
</script>
</body>
</html>
