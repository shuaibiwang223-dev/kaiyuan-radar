<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7561d6">
<meta name="description" content="开源雷达：每 3 小时自动更新的 GitHub 开源项目涨星观察，全中文界面，手机直接看。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>开源雷达 · GitHub 涨星观察</title>
</head>
<body>
<header>
  <a href="./" class="brand"><span>✳</span>开源雷达<small>GitHub 涨星观察</small></a>
  <span class="live" id="live">● 读取中</span>
</header>
<div class="layout">
  <aside>
    <p>功能菜单</p>
    <nav>
      <button data-view="explore" class="active">◫ <span>发现项目</span></button>
      <button data-view="trending">↗ <span>热门榜</span></button>
      <button data-view="changes">⌁ <span>涨星变化</span></button>
      <button data-view="saved">☆ <span>我的收藏</span></button>
      <button data-view="about">ⓘ <span>使用说明</span></button>
    </nav>
    <div class="side-note">每 3 小时自动更新<br>不只看暴涨<br>也看稳定增长和掉星</div>
  </aside>
  <main>
    <section class="hero">
      <div>
        <h1 id="title">好项目，不应该被埋没。</h1>
        <p id="subtitle">每 3 小时自动查一遍，看看哪些开源项目正在变热。</p>
      </div>
      <button id="refresh" class="secondary" aria-label="重新读取数据">↻ 重新读取</button>
    </section>
    <div id="stats" class="stats"></div>
    <div class="notice" id="scope">正在读取数据…</div>
    <section id="content"></section>
    <footer>数据来自 GitHub 公开信息 · 每个数字都标有采集时间<br>浏览不用登录 · 收藏只保存在当前手机或电脑上</footer>
  </main>
</div>
<dialog id="detail"><button class="close" aria-label="关闭">×</button><div id="detail-body"></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
